# evo-control: WirePlumber routing overrides for Audient EVO 8
# Installed by `sudo evo-control install-driver`
#
# Sets the multi-channel pro-audio profile so all DAW + loopback channels
# are accessible, and labels the first stereo pair (PC Out 1+2) as FL/FR
# so normal apps (Discord, browsers, etc.) can enumerate the EVO 8 as a
# standard stereo output.

monitor.alsa.rules = [
  {
    matches = [
      {
        "device.name" = "alsa_card.usb-Audient_EVO8-*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.udev-tagged = true
        device.profile-set = "pro-audio.conf"
        device.profile = "pro-audio-4out-4in"
      }
    }
  }
  {
    matches = [
      {
        "node.name" = "alsa_output.usb-Audient_EVO8-*"
      }
    ]
    actions = {
      update-props = {
        # Never idle-suspend the EVO 8 while evo-control manages it
        session.suspend-timeout-seconds = 0
        # Label the first stereo pair (PC Out 1+2) as FL/FR so apps that
        # filter by channel position (Discord, WebRTC) enumerate this sink.
        audio.channels = 6
        audio.position = ["FL", "FR", "AUX2", "AUX3", "AUX4", "AUX5"]
      }
    }
  }
  {
    matches = [
      {
        "node.name" = "alsa_input.usb-Audient_EVO8-*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        # IN1+IN2 as FL/FR; IN3+IN4 as RL/RR; loopback as AUX4/AUX5
        audio.channels = 6
        audio.position = ["FL", "FR", "RL", "RR", "AUX4", "AUX5"]
      }
    }
  }
]
